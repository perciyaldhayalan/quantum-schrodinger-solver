[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-schrodinger-solver"
version = "0.1.0"
description = "Numerical solvers and computational experiments for the one-dimensional Schrodinger equation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}

authors = [
    {name = "Perciyal D"}
]


keywords = [
    "quantum-mechanics",
    "schrodinger-equation",
    "computational-physics",
    "numerical-methods",
    "quantum-tunnelling",
    "scientific-computing"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics"
]

dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.1",
    "pandas==3.0.5"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "jupyterlab==4.6.3",
    "scipy-stubs==1.18.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
files = ["src"]