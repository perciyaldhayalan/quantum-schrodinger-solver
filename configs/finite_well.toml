[simulation]
name = "Finite Square Well Bound States"

[grid]
x_min = -10.0
x_max = 10.0
points = 2001

[well]
left = -1.0
right = 1.0
depth = 10.0

[physics]
hbar = 1.0
mass = 1.0

[solver]
states = 10
continuum_threshold = 0.0

[validation]
normalization_tolerance = 2.0e-3
parity_tolerance = 1.0e-6