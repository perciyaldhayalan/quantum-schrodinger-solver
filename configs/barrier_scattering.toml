[simulation]
name = "Time-Dependent Rectangular Barrier Scattering"

[grid]
x_min = -30.0
x_max = 30.0
points = 3001

[wavepacket]
center = -10.0
sigma = 1.5
wave_number = 2.0

[barrier]
left = -0.5
right = 0.5
height = 5.0

[physics]
mass = 1.0
hbar = 1.0

[time]
dt = 0.001
steps = 6000
snapshot_interval = 500

[validation]
maximum_probability_error = 1e-9