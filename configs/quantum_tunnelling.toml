[simulation]
name = "Quantum Tunnelling Validation"

[grid]
x_min = -30.0
x_max = 30.0
points = 3001

[wavepacket]
center = -10.0
sigma = 1.5
wave_number = 2.0

[barrier]
left = -0.5
right = 0.5
height = 5.0

[physics]
mass = 1.0
hbar = 1.0

[time]
dt = 0.001
steps = 10000

[validation]
separation_tolerance = 1e-3
probability_tolerance = 1e-8
transmission_agreement_tolerance = 0.03